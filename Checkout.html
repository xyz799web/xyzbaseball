<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XYZ | Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --hotpink: #ff69b4;
    --hotpink-2: #ff1493;
    --lightblue: #add8e6;
    --black: #000;
    --card-bg: #0f0f0f;
    --radius-lg: 12px;
    --radius-md: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: var(--lightblue);
    color: var(--black);
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }

  .checkout-container {
    background: var(--card-bg);
    color: white;
    max-width: 500px;
    width: 100%;
    padding: 30px;
    border-radius: var(--radius-lg);
    box-shadow: 0 0 20px rgba(255,20,147,0.3);
  }

  h1 {
    text-align: center;
    color: var(--hotpink-2);
    margin-bottom: 30px;
  }

  .summary {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
  }

  .summary h2 {
    font-size: 1.3rem;
    color: var(--hotpink);
    margin-bottom: 10px;
  }

  .summary p {
    font-size: 1rem;
    color: white;
    margin-bottom: 6px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: white;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: var(--radius-md);
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  button {
    width: 100%;
    background-color: var(--black);
    color: white;
    padding: 15px;
    font-size: 1.1rem;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background 0.3s;
    font-weight: 700;
  }

  button:hover {
    background-color: var(--hotpink-2);
  }

  .total {
    font-weight: bold;
    margin-top: 10px;
    font-size: 1.1rem;
  }
</style>
</head>
<body>
  <div class="checkout-container">
    <h1>Checkout</h1>

    <div class="summary" id="order-summary">
      <h2>Order Summary</h2>
      <!-- Cart items will appear here dynamically -->
    </div>

    <form id="checkout-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />

      <button type="submit">Proceed to Payment</button>
    </form>
  </div>

<script>
  // --- Load cart from localStorage ---
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const summaryEl = document.getElementById('order-summary');

  let total = 0;
  if(cart.length === 0) {
    summaryEl.innerHTML += "<p>Your cart is empty.</p>";
  } else {
    cart.forEach(item => {
      const itemEl = document.createElement('p');
      itemEl.textContent = `${item.name} x ${item.qty} — $${(item.price * item.qty).toFixed(2)}`;
      summaryEl.appendChild(itemEl);
      total += item.price * item.qty;
    });
    const totalEl = document.createElement('p');
    totalEl.className = 'total';
    totalEl.textContent = `Total: $${total.toFixed(2)}`;
    summaryEl.appendChild(totalEl);
  }

  // --- Handle form submit ---
  document.getElementById("checkout-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;

    const res = await fetch("https://skitter-clumsy-sweatshirt.glitch.me/create-checkout-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, cart })
    });

    const data = await res.json();
    if(data.url) {
      window.location.href = data.url;
    } else {
      alert("Something went wrong. Please try again.");
    }
  });
</script>
</body>
</html>
