<style>
  :root {
    --hotpink: #ff69b4;

    --black: #000;

    --radius-lg: 12px;
    --shadow-neon: 0 6px 30px rgba(255,20,147,0.12), 0 1px 4px rgba(0,0,0,0.4);
    --max-width: 1100px;
  }

  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--lightblue);
    color: var(--hotpink-2);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .page { width: 100%; max-width: var(--max-width); }

  header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-logo { width:50px; height:50px; background:linear-gradient(135deg,var(--hotpink),var(--lightblue)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; box-shadow: var(--shadow-neon); font-size:18px; }
  nav a { text-decoration:none; padding:10px 14px; border-radius:8px; background:var(--black); color:white; font-weight:600; transition: 0.2s; }
  nav a:hover { background:var(--hotpink); }

  h1,h2,h3,h4 { color: var(--hotpink-2); margin-bottom:15px; text-align:center; }

  /* Search */
  .search { margin: 20px auto; max-width: 400px; }
  #searchInput { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:1rem; }
  #itemlist { list-style:none; margin-top:15px; padding:0; }
  #itemlist li { margin:10px 0; }
  #itemlist li a { display:block; padding:10px 14px; border-radius:8px; font-weight:700; background:linear-gradient(90deg,var(--hotpink),var(--lightblue)); color:white; text-decoration:none; transition: 0.3s; }
  #itemlist li a:hover { background:linear-gradient(90deg,var(--lightblue),var(--hotpink)); color:black; }

  /* Products Grid */
  .products-container {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
    margin-top:28px;
  }
  .product {
    background: var(--card-bg);
    padding:16px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-neon);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .product:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.6); }
  .product img { width:100%; height:140px; object-fit:cover; border-radius:8px; margin-bottom:12px; }
  .product h4 { margin-bottom:6px; color:white; }
  .product .price { font-weight:700; margin-bottom:10px; color:#fff; }
  .product .actions { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:auto; flex-wrap:wrap; }
  .qty-container { display:flex; align-items:center; gap:6px; }
  .qty-btn { background:var(--hotpink); border:none; color:white; padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:700; }
  .qty-btn:active { transform: scale(.98); }
  .qty-value { min-width:26px; display:inline-block; text-align:center; color:white; font-weight:700; }
  .add-to-cart-btn { background:linear-gradient(180deg,var(--hotpink),var(--hotpink-2)); border:none; color:white; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:800; box-shadow:0 8px 20px rgba(255,20,147,0.12); }
  .add-to-cart-btn:hover { transform: scale(1.04); }

  hr { margin:30px 0; border:1px solid var(--hotpink-2); }
  a.back-home { display:inline-block; font-weight:600; margin-top:20px; }

  footer { margin-top:40px; font-size:0.9rem; color:#222; text-align:center; }

  @media(max-width:599px) {
    .product { max-width:90%; }
    label,input,button { max-width:100%; }
  }
</style>

</head>

<script>
  // Search
  const searchInput = document.getElementById("searchInput");
  const items = document.querySelectorAll("#itemlist li");
  searchInput.addEventListener("input", () => {
    const term = searchInput.value.toLowerCase().trim();
    items.forEach(li => { li.style.display = li.textContent.toLowerCase().includes(term) ? "" : "none"; });
  });

  // Cart logic
  let cart = JSON.parse(localStorage.getItem('xyz_cart')||'{}');
  function saveCart(){ localStorage.setItem('xyz_cart', JSON.stringify(cart)); }
  document.querySelectorAll('.product').forEach(productEl=>{
    const name=productEl.dataset.name;
    const price=parseFloat(productEl.dataset.price);
    const btnAdd=productEl.querySelector('.add-to-cart-btn');
    const btnInc=productEl.querySelector('.qty-increase');
    const btnDec=productEl.querySelector('.qty-decrease');
    const qtyEl=productEl.querySelector('.qty-value');

    btnInc && btnInc.addEventListener('click',()=>{ qtyEl.textContent=String(Math.min(99,parseInt(qtyEl.textContent)+1)); });
    btnDec && btnDec.addEventListener('click',()=>{ qtyEl.textContent=String(Math.max(1,parseInt(qtyEl.textContent)-1)); });
    btnAdd && btnAdd.addEventListener('click',()=>{
      const qty=parseInt(qtyEl.textContent);
      if(cart[name]) cart[name].qty += qty; else cart[name]={price:price, qty:qty};
      if(cart[name].qty>999) cart[name].qty=999;
      saveCart();
      alert(`${qty} x ${name} added to cart`);
    });
  });
</script>
